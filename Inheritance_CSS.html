<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inheritance in CSS </title>

    <style>
        .parent {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color :blue;
            border: 1px red solid;
            padding :20px
        }

        .child {
            font-size: 40px;
            color :green;

        }



    </style>

</head>
<body>
    <div class="parent">
        <p> Let's say this is a header H1 but i will not implement any class or styles to it</p>
        <p class="child">this one i applied child class to it </p>
    </div>
    
</body>
</html>
