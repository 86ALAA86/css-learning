<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justify-self & Align-self</title>

    <style>

        * {
            margin :0px;
            padding : 0px;
            box-sizing: border-box;
        }
        .gridContainer {
            display:grid;
            grid-template-columns: repeat(3 ,200px) ;
            grid-template-rows: repeat(3 ,100px);
            border: 5px solid red;
            background-color: rgba(175, 175, 216, 0.552);
            height: 600px;
            margin: 2rem;
            gap: 1rem 1rem;
            justify-content:center;
            align-content: center;

            



        }
        
        .gridItem {
            background-color: rgb(120, 27, 27);
            color: white;
            font-size: large;
            height: 50px;
            min-width: 50px;
            border: 2px solid white;

        }

        .specialItem {
             background-color: rgb(120, 94, 27);
             justify-self: start;
             align-self: start;

        }



    </style>


</head>
<body>

    <div class="gridContainer">
        <div class="gridItem">1</div>
        <div class="gridItem">2</div>
        <div class="gridItem">3</div>
        <div class="gridItem ">4</div>

         <div class="gridItem specialItem">5</div>
        <div class="gridItem">6</div>
        <div class="gridItem">7</div>
         <div class="gridItem">8</div>

       

        

    </div>



    
</body>
</html>
