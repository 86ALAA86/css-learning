<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Galary</title>
    <style>

        * {
            margin: 0;
            padding: 0;      
        }
        body {
         background-color: rgba(113, 114, 143, 0.501);
        }
        header {
            background-color: rgba(0, 0, 0, 0.614);
            margin: 0 auto;
            display:flex;
            flex-direction: column;
            align-items: center;    
        }
        header h1 {
            color :rgba(255, 255, 255, 0.775);
            text-align: center;
            margin: 0 auto;
        }
        nav ul {
            display: flex;
            align-items: center;
            list-style-type: none;       
        }
        nav ul li {
            color: white;
            margin: 0.5rem 1rem ;
            font-size: 1.2rem;
        }

         nav ul li a ,a{
            color: inherit;
            padding: 0.5rem;
        }

        nav ul li a:hover,a:hover {
            border-radius: 10px;
            background-color: rgba(209, 209, 47, 0.431);
        }

        .Flexmain {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content:center;
            gap : 1rem;

            margin-top: 0.5rem;
                
        }

        .flexItem {
            display: flex;
            flex : 1 1 calc(33% - 1rem);
            border :3px solid red ;
            justify-content: center;
            align-items: center;
            height: 150px ;
       
        }

        .footer {
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            background-color: rgba(113, 150, 150, 0.717);


        }

        .footer-col  {
            display: block;
            justify-content: space-between;
            font-size: larger;
            margin:5px 2rem;
        }

        .footer-col p {
            margin :0.5rem
           
        }

        @media (max-width :600px)
        {
            .footer {
                flex-direction: column;
                align-items: flex-end;
            }

        }
     



      




    </style>
</head>
<body>
    <header>
        <h1>Welcom to my flex Gallary</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Help</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>


    <main class="Flexmain">

        <img class="flexItem" src="Images/background1.png" alt="">
        <img class="flexItem" src="Images/background2.jpg" alt="">
        <img class="flexItem" src="Images/background3.jpg" alt="">
        <img class="flexItem" src="Images/background4.jpg" alt="">
        <img class="flexItem" src="Images/background5.jpg" alt="">
        <img class="flexItem" src="Images/background6.jpg" alt="">
        <img class="flexItem" style="width: 33vw; height:auto;" src="Images/background7.jpg" alt="">



    </main>

    <footer class="footer">
        <div class="footer-col">
            <h3>RATE US !!</h3>
            <p><a href="#">Click Here</a></p>
        </div>

         <div class="footer-col">
            <h3>Follow US </h3>
            <p><a href="#">Instagram</a></p>
            <p><a href="#">Facebook</a></p>
            <p><a href="#">Linkedin</a></p>
            <p><a href="#">X</a></p>
        </div>

         <div class="footer-col">
            <h3>Contact With Us </h3>
            <p><a href="#">Whatsapp</a></p>
            <p><a href="#">Email</a></p>
            <p><a href="#">Telephone</a></p>
        </div>

    </footer>

    
</body>
</html>
