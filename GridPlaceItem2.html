<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid : Item's Content Alignment In Cell</title>

    <style>
        * {
            margin :0;
            padding: 0;
            box-sizing: border-box;
        }

        .GridContainer {
            display: grid;
            grid-template-columns: repeat(4,1fr) ;
            grid-template-rows:repeat(2,26.2vh) ;
            background-color: rgba(0, 0, 0, 0.281);
            gap :2.6vh 0.6vw;
            padding: 0.5rem;
            border-radius: 20px;
            width: 100%;

          
        }

        .example1 {
              justify-items: center;
            align-items: end;
        }

        .example2 {
              place-items: start;
        }
    
        .example3 {
          justify-items: end;
          align-items: center;
        }
    
        .example4 {
          justify-items: stretch;
          align-items: stretch;
        }

        .GridItem {
            display :flex;
            border: 3px solid red;
            background-color:white;
            border-radius: 30px;
            color: white;
            
            padding: 1rem;
        }

        
         .colline {
            background-color: red ;
            border: 3px solid black;
            width: 20px;
            height: 27vw;
            margin-right: 23.4vw;
         }

          .rowline {
            background-color: red ;
            border: 3px solid black;
            width: 100vw;
            height: 10px;
            margin-bottom: 12.4vw;
            
         }

       


    </style>
</head>
<body >
    <h1>Grid : Item's Content Alignment In Cell</h1>

    <h2 style="margin-bottom: 3rem;">
        1 ) Justify-items : center , align-items : end
    </h2>

    <div style="position: relative; ">

       <div style="position: relative;">

      <div style="display: flex; position: absolute ;top :0px ">     
        <div class="colline"></div>
        <div class="colline"></div>
        <div class="colline"></div>
        <div class="colline"></div>
        <div class="colline"></div>
     </div>

     <div style="display: block;">
        <div class="rowline"></div>
        <div class="rowline"></div>
        <div class="rowline"></div>
     </div>
       </div>
   
       <div class="GridContainer example1" style="position: absolute; top :0px; margin: 10px 18px;">

         <div class="GridItem ">
        </div>

        <div class="GridItem ">
        </div>

        <div class="GridItem">
        </div>

         <div class="GridItem ">
        </div>

        <div class="GridItem ">
        </div>

        <div class="GridItem">
        </div>

        <div class="GridItem ">
        </div>

        <div class="GridItem">
        </div>

       </div>

    </div>

     <div style="display: block;">

        <div class="colline"></div>

        <div class="colline"></div>

</html>
