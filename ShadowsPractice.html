<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows Practice </title>

    <style>
        *{
            margin :0px;
            padding :0px ;
            box-sizing: border-box;
        }

        .btn-Primary {
            background-color: blue;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin :1rem;
            width: 200px;
            height: 50px ;
            font-size: larger;
        }

        .btn-shadow {
            box-shadow: -3px -3px 4px red
             ,3px 3px 4px green;
            
        }

       
        
        .btn-Primary:hover  {
         box-shadow: -6px -6px 10px red,
         6px 6px 10px green;
            
        }

      

        .txt-Primary {
            margin-top: 6rem;
            text-align: center;
        }
        
        .txt-Primary:hover {
             text-shadow: 
            0px 0px 0px  red,
            0px 0px 5px  red,
            0px 0px 10px red,
            0px 0px 20px red;

        }

        .txt-Shadow {
            text-shadow: 
            0px 0px 0px blue,
            0px 0px 5px blue,
            0px 0px 10px blue,
            0px 0px 20px blue;
        }

        .txt-input-primary {
            border: 2px solid red ;
            background-color: white;
            color: black;
            font-size: 2rem;
            width: 200px;
            height: 50px;
           
            padding-left: 1rem;
        }

        .txt-input-primary:focus {
            box-shadow:inset 0px 0px 10px rgb(163, 8, 8);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit ,minmax(200px,1fr));
            border :2px dashed green ;
            background-color: rgba(0, 0, 255, 0.331);
            margin :2rem;
            padding: 1rem;
        
        }

        .grid-container img {
            width :150px;
            height: auto;
            filter :drop-shadow(4px 4px 4px rgba(255, 0, 0, 0.45));
        }




    </style>


</head>
<body>
    <button class="btn-Primary btn-shadow">
        click
    </button>

    <h1 class="txt-Primary txt-Shadow">Text Shadow Example</h1>
    
    <p style="margin: 2rem auto;"><input type="text" class="txt-input-primary txt-input-shadow">
</p>

<div class="grid-container">
    <img src="Images/background1.png" alt="">
    <img src="Images/background2.jpg" alt="">
    <img src="Images/background3.jpg" alt="">

</div>

</body>
</html>
