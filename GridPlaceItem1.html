<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        .flexContainer {
            display: flex;
            flex-direction: row;
            gap: 1rem;
             align-items:flex-start;
             background-color: rgba(0, 0, 0, 0.198);
        }

        .GridContainer {
            display: grid;
            grid-template-columns: 
            repeat(4,300px);
            gap: 1rem 1rem;
            margin: 0;
        }

        .GridItem {
            background-color: rgba(146, 63, 63, 0.613);
            padding: 1rem;
            
            border-radius: 20px;
            text-align: center;
        }

        .collines  {
            font-size: xx-large;
            list-style-type: none;
            display: flex;
        }

        .collines li {
            margin:5px 0 ;
            margin-right: 19rem;
        }


         .rowlines  {
            font-size: xx-large;
            list-style-type: none;
            display: flex;
            flex-direction: column;
        }

        .rowlines li {
            
            margin-top: 2.2rem;
            

        }

        .item5 {
            grid-column:3/4 ;
            grid-row:1/6 ;
            background-color: rgb(97, 97, 149);
            border: 2px solid red;
        }

         .item1 {
            grid-column:2/5 ;
            grid-row:3/4;
            background-color: rgb(97, 149, 113);
            border: 2px solid red;
            text-align: start;
        }

         .item2 {
            grid-column:1/3 ;
            grid-row:5/6;
            background-color: rgb(134, 165, 14);
            border: 2px solid red;
        }

     
        
       



    </style>
</head>
<body>
    
    <ul class="collines">
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
    </ul>


    <div class="flexContainer">

           <ul class="rowlines">
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
        <li>6</li>
     </ul>

     <div class="GridContainer">

         <div class="GridItem item5">
            Item 5
        </div>

        
        <div class="GridItem item1">
            Item 1
        </div>

        <div class="GridItem item2">
            Item 2
        </div>

        <div class="GridItem">
            Item 3
        </div>

        <div class="GridItem">
            Item 4
        </div>

        <div class="GridItem">
            Item 6
        </div>

         <div class="GridItem">
            Item 7
        </div>

         <div class="GridItem">
            Item 8
        </div>

         <div class="GridItem">
            Item 9
        </div>

         <div class="GridItem">
            Item 10
        </div>

         <div class="GridItem">
            Item 11
        </div>

        <div class="GridItem">
            Item 12
        </div>

         <div class="GridItem">
            Item 13
        </div>

         <div class="GridItem">
            Item 14
        </div>

         <div class="GridItem">
            Item 15
        </div>

         <div class="GridItem">
            Item 16
        </div>


     </div>

    </div>


  
    
</body>
</html>
