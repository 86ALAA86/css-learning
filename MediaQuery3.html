<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query Resolution example </title>

    <style> 
        .hero {
            width: 100% ;
            height: 300px;
            background:url("Images/background5.jpg") no-repeat center/cover;
        }

        @media  (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi){
            .hero {
                            background-image:url("Images/background1.jpg");

            }
            
        }


    </style>
</head>
<body>
    <div class="hero">

    </div>
    
</body>
</html>
