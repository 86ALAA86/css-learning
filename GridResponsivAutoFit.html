<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid minmax</title>

    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        .GridContainer {
            display: grid;
            grid-template-columns: 
            repeat(auto-fit , minmax(150px,1fr));
            gap:0.5rem;
            margin: 2rem;
        }

        .GridItem {
            background-color: rgba(146, 63, 63, 0.613);
            padding: 1rem;
            
            border-radius: 4px;
            text-align: center;
        }



    </style>
</head>
<body>
    <div class="GridContainer">
        <div class="GridItem">
            Item 1
        </div>

        <div class="GridItem">
            Item 2
        </div>

        <div class="GridItem">
            Item 3
        </div>

        <div class="GridItem">
            Item 4
        </div>

        <div class="GridItem">
            Item 5
        </div>

        <div class="GridItem">
            Item 6
        </div>
    </div>
    
</body>
</html>
