<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB Colors </title>

    <style>
        body {
            background-color: rgb(240,240,240); /* light gray backgorund*/
       font-family: Arial, Helvetica, sans-serif;
       margin :20px;
       
        }

        h1 {
            color :rgb(0,102,204); /* a vibrnat blut for the heading */
       text-align: center;
        }

        p {
          color:  rgb(51,51,51); /*Dark gray text*/
        font-size: 18px;
        }

        .overlay {
            background-color: rgba(255,0,0,0.3);/*semi-transparent red overlay */
            padding :20px;
            margin-top: 20px;
            border: 1px solid rgb(255,0,0);
        }

    </style>




</head>
<body>
    <h1>Welcome to css RGB Colors </h1>
    <p>Css RGB Colors allow you to mix red , green and blue in various 
        intensities . you can also control transparency using RGBA.
    </p>
    <div class="overlay">
        <p>this div has a semi-transparent red backgorund , demonstrating the rgba function .</p>
    </div>
    
</body>
</html>
