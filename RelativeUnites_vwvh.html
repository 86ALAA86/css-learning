<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative unites ViewPort (vw, vh)</title>

    <style>
        *{
            margin :0;
            padding :0;
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            line-height: 1.4;
        }

        .main {
            width :100wv;
            height :100vh;
            display :flex;
            align-items: center;
            justify-content :center;
            background :linear-gradient(135deg ,#6a11cb,#2575fc);
            color :white;
            text-align: center;
            font-size: 5vw;
        }

        .section {
            padding :5vh 5vw;
            background :#f4f4f4;
            min-height :50vh;
        }

        .section p {
            font-size: 2vw;
        }

    </style>


</head>
<body>

    <div class="main">
        <div>
            <h1>Viewport Units :vw &vh</h1>
            <p>Resize your browser to see the text and layout
                adapt in real time.
            </p>
        </div>
    </div>

    <div class="section">
        <h2>Responsive Content Section</h2>
        <p>
            This container uses <strong>5hv</strong>vertical padding and <strong>5vw</strong>horizontal padding.
    The heading and paragraphs scale with the viewport for consistent design across devices.
        </p>
    </div>



    
</body>
</html>
