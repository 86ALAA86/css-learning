<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transitions learning.</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;
        }
        body {
            font-family: arial , sans-serif;
            background-color: #f9f9f9;
            color: #333;
            padding: 2rem;
            max-width: 800px;
            margin: auto;
            line-height: 1.5;
        }

        h1,h2 {text-align: center ;margin-bottom: 1rem;}
        section {margin-bottom: 3rem;}

        .demo-container {
            display: flex;
            gap :1rem;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .demo-box {
            width: 100px ;height: 100px;
            background-color: #e74c3c;
            color :#fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;;
        }

        .label {
            text-align: center;font-size: .85rem;color: #555;margin-top: .5rem;max-width: 100px;
        }

        .width-demo {
            transition-property: width ;
            transition-duration: 2s;
        }

        .width-demo:hover {
            width: 200px;
        }

        .delay-demo {
            transition: background-color 1s ease 0.5s;
        }

        .delay-demo:hover {
            background-color: #3498db;
        }

        .timing-demo {transition :transform 1s}

        .timing-demo.ease:hover {
            transition-timing-function: ease;
            transform: translateY(-20px);
        }

         .timing-demo.linear:hover {
            transition-timing-function: linear;
            transform: translateY(-20px);
        }

         .timing-demo.in-out:hover {
            transition-timing-function: ease-in-out;
            transform: translateY(-20px);
        }

        .shorthand-demo {
            transition :background-color 0.8s ease-in-out 0.2s,
            transform 1s cubic-bezier(0.68,-0.55,0.27,-1.55);
        }

        .shorthand-demo:hover {
            background-color: #2ecc71;
            transform:rotate(15deg) scale(1.2);
        }


    </style>


</head>
<body>

     <h1>CSS Transitions – Combined Demo</h1>

  <!-- 1️⃣ Width Expansion -->
  <section>
    <h2>1) Width Expansion</h2>
    <div class="demo-container">
      <div>
        <div class="demo-box width-demo">Hover</div>
        <div class="label">width → 200 px<br>duration 2 s</div>
      </div>
    </div>
  </section>

  <!-- 2️⃣ Delayed Background Change -->
  <section>
    <h2>2) Delayed Background Change</h2>
    <div class="demo-container">
      <div>
        <div class="demo-box delay-demo">Hover</div>
        <div class="label">bg-color<br>1 s dur · 0.5 s delay</div>
      </div>
    </div>
  </section>

  <!-- 3️⃣ Easing Curves -->
  <section>
    <h2>3) Easing Curves</h2>
    <div class="demo-container">
      <div>
        <div class="demo-box timing-demo ease">Ease</div>
        <div class="label">ease</div>
      </div>
      <div>
        <div class="demo-box timing-demo linear">Lin</div>
        <div class="label">linear</div>
      </div>
      <div>
        <div class="demo-box timing-demo in-out">In-Out</div>
        <div class="label">ease-in-out</div>
      </div>
    </div>
  </section>

  <!-- 4️⃣ Multiple-Property Shorthand -->
  <section>
    <h2>4) Multiple-Property Shorthand</h2>
    <div class="demo-container">
      <div>
        <div class="demo-box shorthand-demo">Hover</div>
        <div class="label">bg + transform<br>custom cubic</div>
      </div>
    </div>
  </section>
    
</body>
</html>
