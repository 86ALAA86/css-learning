<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google fonts</title>

 <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link 
  rel="stylesheet" 
  href="https://fonts.googleapis.com/css?family=Audiowide|Sofia|Trirong|Noto+Kufi&display=swap">

  <style>
    h1.a {
        font-family: "Noto Kufi Arabic" ,sans-serif;
    }

     h1.b {
        font-family: "Audiowide" ,sans-serif;
    }
     h1.c {
        font-family: "Sofia" ,sans-serif;
    }
     h1.d {
        font-family: "Trirong" ,sans-serif;
    }
     h1.e{
        font-family: "MontSerrat" ,sans-serif;
    }



  </style>


</head>
<body>

     <h1 class="a">علي مع الحق و الحق مع  علي</h1>
  <h1 class="b">Audiowide Font</h1>
  <h1 class="c">Sofia Font</h1>
  <h1 class="d">Trirong Font</h1>
  <h1 class="e">Montserrat Font</h1>
  
  <br>
  ⚠️ <b>Performance Note:</b>    Every additional font weight or family increases load time. Request only the styles you actually use.

    
</body>
</html>
