<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .main {
            background : #1E90FF url(Images/background7.jpg) no-repeat fixed center /cover ;
            color :white ;
            height: 100vh;
            display: flex ;
            align-items: center;
            justify-content :center;
            text-align: center;
        }

        .info {
            background : #FFF url(Images/background5.jpg) repeat-x top / cover ;
            color : white ; 
            padding :20px; 
            text-align: center;
        }

        .MainTitle {
            background-color: rgba(35, 7, 38, 0.4);
            color :#FFF;
            padding: 20px ;
            text-align: center;
            font-size: 50px;
        }


    </style>

</head>
<body>

    <div class="main">
        <h1 class="MainTitle">Welcome to our website <br>
        <small>Experience the power of CSS background shorthand</small></h1>
    </div>

    <div class="info">
        <h2>About our Design</h2>
        <p>The Background shorthand property helps us combine multiple background styles into one concise declaration .
            this makes our CSS cleaner and our designs more dynamic . 
        </p>
    </div>
    
</body>
</html>
