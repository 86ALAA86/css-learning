<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opacity and Transparency Example</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;
        }

       html, body {
    height: 100%;
    margin: 0;
     }

     body {
         background-image: url("Images/background1.png");
         background-repeat: no-repeat;
         background-size: cover;
         background-position: center;
         font-family: arial ,sans-serif;
         margin :0;
         padding: 0;
         color :white;
     }

     .h1 {
        text-align: center;
        margin-bottom :1.5rem;
     }

     .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      justify-items: center;
    }

     .box {
        width: 200px;
        height: 120px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
     }

     .opacity-box {
        background :#3498db;
        color: #fff;
        opacity: 0.5;
     }

     .rgba-box {
        background :rgba(231,76,60,0.6);
        color :#fff;
     }

     .hsla-box {
        background-color: hsla(145 , 75%, 45% ,0.4);
      color :#000;
    }

    .hover-box {
        background:black ;
        color: #fff;
        opacity: 1;
        transition: opacity 0.3s ease;
    }

    .hover-box:hover {
        opacity: 0.5;
        color :black;
        background-color: white;
    }

 


    </style>
</head>
<body>
    
    <h1>CSS Opacity / Transparency Demo</h1>
  <div class="grid">
    <div class="box opacity-box">
      opacity: 0.5
    </div>
    <div class="box rgba-box">
      background: rgba(231,76,60,0.6)
    </div>
    <div class="box hsla-box">
      background: hsla(145,75%,45%,0.4)
    </div>
    <div class="box hover-box">
      Hover to Fade
    </div>
  </div>
</body>
</html>
