<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

       <style>
        h1 {
            font-size: 5vmax;
            text-align: center ;
            color :#1a237e;
            margin :1rem 0;
            ;
        }
        .box {
            width :20vmin;
            height: 20vmin;
            background :#c5e1a5;
            display :flex;
            align-items: center ;
            justify-content: center;
            margin: 1rem auto;
            font-size: 2vmin;
            color :#33691e;
            border: 4px dashed #bf360c;

          
        }

        .Artboard {
      width: min(100vmax, 100vmin);   /* fits within whichever viewport side is smaller */
      height: min(100vmax, 100vmin);
      background: #ffccbc;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2rem auto;
      border: 4px dashed #bf360c;
              font-size: 4vmin;
            text-align: center;
            color:#bf360c;

        }

        .avatar {
            width: 15vmin;
            height: 15vmin;
            border-radius: 50%;
            background :url('https://i.pravatar.cc/300') /center no-repeat;
            margin :1rem auto ;
            border :3px solid #ff7043;
       
        }

    </style>
    
</head>
<body>

    <div class="box">
        20vmin * 20vmin
    </div>

    <div class="Artboard">
        Artboard using <br>
        min(100vmax ,100vmin)
    </div>

    <div class="avatar"> </div>

    <p style="text-align: center ;font-size: 2vmax;color :#424242;">
        Resize the browser to see everything scale!
    </p>

 
    
</body>
</html>
