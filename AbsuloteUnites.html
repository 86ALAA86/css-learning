<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .pixel-box {
            width :300px;
            height: 150px;
            background:lightgray;
            border :2px solid #333;
            margin :20px auto ;
            text-align: center;
            line-height :150px;
            font-size: 16px;
        }

        .inch-box {
            width: 2in;
            height :1in;
            background :#ffe0b2;
            border :1px solid #f6452d;
            margin :20px;
            padding :10px;
        }

        .cm-box {
            width :5cm ;
            height: 2cm;
            background :#e1bee7;
            border :1px solid #500571;
            margin :20px;
            padding :10px;
        }



    </style>
</head>
<body>
    <div class="pixel-box">300px <code> ×</code> 150px</div>
      <div class="inch-box">2in × 1in</div>
  <div class="cm-box">5cm × 2cm</div>

</body>
</html>
