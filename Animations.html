<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations in CSS</title>

    <style>
        *{
            margin :0px;
            padding :0px;
            box-sizing: border-box;
        }

        .flex-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 90%;
            height: 200px;
            background-color: rgba(0, 0, 0, 0.525);;
            border-radius: 10px;
            margin: 2rem auto;
            padding: 1rem;
            color: white;
            position: relative;
        }

        .moveable-ball {
            width: 40px ;height: 40px ;
            border-radius: 50%;
            background-color: blue;
            border: 2px solid white;
            position: absolute;
            


            animation-name: move ;
            animation-duration: 10s;
            animation-timing-function: ease-in-out;
            animation-delay: 0s;
            animation-iteration-count: infinite;
            animation-direction:normal;
            animation-fill-mode: both;
            animation-play-state: running;

        }

        @keyframes move {
            0% {left: 2%;
                 top :20%;
                background-color: rebeccapurple; }
            25% { left: 2%;
                 top :78%;
                  background-color: red;}
            50%{ left: 90%;
                 top :78%;
                 background-color: green; }
            75% {left: 90%;
                 top :20%;
                 background-color: yellow;}
            100% {left: 2%;
                 top :20%;
                  background-color: rebeccapurple; }
        }

        .Opacity-text {
            background-color: blue;
            border: 2px solid white;
            font-size: 4rem;
            border-radius: 10px;
            padding: 1rem;
            animation-name: opText ;
            animation-duration: 2s;
            animation-timing-function: ease-in-out;
            animation-delay: 0s;
            animation-iteration-count: infinite;
            animation-direction:alternate;
            animation-fill-mode: both;
            animation-play-state: running;
        }

        @keyframes opText {
            0%   {opacity: 0;}
            100% {opacity: 1;}
        }


        .spinner {
            height: 40px;
            width: 40px;
            background-color: aliceblue;
            border-radius: 50%;
            border:4px solid aliceblue;
            border-top-color: red;
            
            animation-name: spin;
            animation-duration: 1s;
            animation-timing-function: linear;
            animation-delay: 0s;
            animation-iteration-count: infinite;
            animation-direction:normal;
            animation-fill-mode: both;
            animation-play-state: running;
        }

        @keyframes spin{
            0%   {transform:rotate(0deg);}
            100% {transform: rotate(360deg);}
        }


         .pulseing-button {
            width: 100px;
            height: 50px;
            background-color: aliceblue;
            border-radius: 10px;
            border:4px solid black;
            
            
            animation-name: pulse;
            animation-duration: 1s;
            animation-timing-function: ease-in-out;
            animation-delay: 0s;
            animation-iteration-count: infinite;
            animation-direction:normal;
            animation-fill-mode: both;
            animation-play-state: running;
        }

        @keyframes pulse{
            0%   {transform : scale(1,1);}
            25%   {transform: scale(1.50,1.25);}
            50%   {transform: scale(1,1);}
            75%   {transform: scale(1.25,1.50);}
            100% {transform : scale(1,1);}
        }

        



    </style>

</head>
<body>
    <h1 style="text-align: center;">Animations Example :</h1>
    <div class="flex-container">
        <h2 style="position: absolute; top :10px ;left :10px">Moving ball :</h2>
        <div class="moveable-ball"></div>
    </div>

     <div class="flex-container">
        <h2 style="position: absolute; top :10px ;left :10px">Text vanishing:</h2>
        <div class="Opacity-text">hidden text</div>
    </div>

     <div class="flex-container">
        <h2 style="position: absolute; top :10px ;left :10px">loading disk :</h2>
        <div class="spinner"></div>
    </div>

    <div class="flex-container">
        <h2 style="position: absolute; top :10px ;left :10px">loading disk :</h2>
        <div class="pulseing-button"></div>
    </div>
    
</body>
</html>
