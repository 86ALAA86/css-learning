<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform Example </title>

    <style>

        *{
            margin :0px ;padding:0px ;box-sizing: border-box;
        }

        .container-3d {
            width: 100%;
            height: 200px;
            perspective: 1000px;
            margin: 1rem 1rem;
        }
        .rotate-card {
            position: relative;
            width: 200px ;
            height: 150px;  
            margin: 1rem 2rem;
           transform-style: preserve-3d;
           transition: transform 3s;
        }

        .face {
            background-color: rgba(0, 0, 0, 0.356);
            padding: 1rem;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            backface-visibility: hidden;
            position: absolute;
            display: flex;align-items: center;justify-content: center;
            font-size: large;
            
        }
        .rotate-card:hover {
            transform: rotateY(1080deg);
        }

        .front {
            background-color: black;
            color :white;
            border :2px solid white;


        }

        .back {
            border :2px solid black;
            background-color: white;
            color :black;
            transform: rotateY(180deg);
        }

        .Gallary {
            display: flex;
            align-items: center;
            justify-content:space-evenly;
            flex-wrap: nowrap;
            background-color: beige;
            border:2px dotted red;
            width: 90%;
            height: 300px;
            margin :1rem auto;
            gap: 1rem;
        }

        .image-item-wrapper {
                        perspective: 800px;


        }

        .image-item {
            width :200px;
            height:150px;
            transform-style: preserve-3d;
            border :3px solid black;
            transition: transform 3s;
            perspective-origin: center;


            
        }

        .image-item img {
            width: 100%;
            height: 100%;
        }

        .image-item:hover {
            transform: translateZ(90px);
        }

        .iso-grid {
      width: max-content;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, 60px);
      grid-gap: 10px;
      transform: skewY(-15deg) scaleY(0.866); /* isometric projection */
    }
    .iso-grid .tile {
      width: 60px;
      height: 60px;
      background: #8e44ad;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.9rem;
      border: 1px solid #fff;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    /* Correct the heading inside the skewed grid */
    .iso-grid h2 {
      grid-column: span 4;
      text-align: center;
      transform: skewY(15deg) scaleY(1.155); /* reverse the container’s transform */
      margin-bottom: .5rem;
      color: #444;}



    </style>




</head>
<body style="background-color: skyblue;">
    <h1>Transformation Example </h1>

    <h2>First example : Rotate a logo 360 deg</h2>

    <div class="container-3d">
        <div class="rotate-card">
            <p class="face front">Alaa</p>
            <p class="face back">Nadweh</p>
        </div>
    </div>

      <h2>Second example : Photo Gallary</h2>

    <div class="Gallary">
       
        <div class="image-item-wrapper">
                    <div class="image-item"> <img src="Images/background1.png" alt=""></div>

        </div>

         <div class="image-item-wrapper">
                    <div class="image-item"> <img src="Images/background2.jpg" alt=""></div>

        </div>

         <div class="image-item-wrapper">
                    <div class="image-item"> <img src="Images/background3.jpg" alt=""></div>

        </div>

         <div class="image-item-wrapper">
                    <div class="image-item"> <img src="Images/background4.jpg" alt=""></div>

        </div>
    </div>

      <h2 style="width:100%; text-align:center;">3) Isometric Grid</h2>
  <section>
    <!-- Place heading inside iso-grid for proper skew compensation -->

    <div class="iso-grid">
      
      <div class="tile">1</div>
      <div class="tile">2</div>
      <div class="tile">3</div>
      <div class="tile">4</div>
      <div class="tile">5</div>
      <div class="tile">6</div>
      <div class="tile">7</div>
      <div class="tile">8</div>
    </div>
    <br>
    <p style="text-align:center; margin-top:1rem;">Elements are skewed and scaled to create an isometric view.</p>
  </section>

   
</body>
</html>
